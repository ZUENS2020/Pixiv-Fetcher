# Point a dedicated HTTPS hostname at the relay (docker compose maps 127.0.0.1:8789).
location / {
    proxy_pass http://127.0.0.1:8789/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

